[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowvm-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "shadowc"
]

[project.scripts]
shadowvm-server = "shadowvm_server.__main__:main"

[tool.setuptools]
packages = ["shadowvm_server"]
